; ESP32-S3 firmware for the spoofed Remote ID scorer.
; The Wio-S3 module is an ESP32-S3. Flash with `pio run -t upload` from firmware/.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
