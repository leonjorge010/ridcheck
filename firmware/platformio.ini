; Remote ID scorer for a generic ESP32-S3 dev board (ESP32-S3-DevKitC-1).
; Flash with `pio run -t upload` from firmware/.

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
